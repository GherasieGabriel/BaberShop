<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BarberShop - Booking</title>
    <link rel="stylesheet" href="css/styles.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
		rel="stylesheet">
</head>
<body>
<header>
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="index.html">BarberShop</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNavbar" aria-controls="mainNavbar"
            aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="barbers.html">Barbers</a></li>
            <li class="nav-item"><a class="nav-link" href="booking.html">Book Now</a></li>
            <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="prices.html">Prices</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>

        <div class="d-flex align-items-center text-light">
            <a href="profile.html" class="btn btn-outline-warning btn-sm me-2">Profile</a>
                <span class="me-1 fw-bold">Admin</span>
                <span class="text-muted">&lt;admin@yahoo.com&gt;</span>
        </div>
    </div>
</nav>
</header>

<main>
    <h1>Book an appointment</h1>

    <form class="booking-form">
        <label>
            Full name:
            <input type="text" name="fullName" required>
        </label>

        <label>
            Email:
            <input type="email" name="email" required>
        </label>

        <label>
            Service:
            <select name="service">
                <option>Haircut</option>
                <option>Beard Trim</option>
                <option>Haircut + Beard</option>
            </select>
        </label>

        <label>
            Barber:
            <select name="barber">
                <option>Any available</option>
                <option>Alex</option>
                <option>Mark</option>
                <option>Chris</option>
            </select>
        </label>

        <label>
            Date:
            <input type="date" name="date" required>
        </label>

        <label>
            Time:
            <input type="time" name="time" required>
        </label>

        <label>
            Notes:
            <textarea name="notes" rows="3" placeholder="Optional"></textarea>
        </label>

        <button type="submit" class="btn-primary">Submit reservation</button>
    </form>
</main>

<footer>
    <p>2026 Barber-Shop.</p>
</footer>
</body>
</html>
